<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A final self-check for the Unit 1 Movement Dossier. Questions, not answers.">
<title>Finish the Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{-webkit-text-size-adjust:100%}
  body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<link rel="stylesheet" href="../../assets/sehs.css">
</head>
<body>
<div class="wrap narrow">
  <div class="dmast">
    <a class="backlink" href="../">&larr; Unit 1 review</a>
    <button class="themebtn" id="themebtn" type="button">Theme</button>
    <p class="eyebrow">IB SEHS SL &middot; Unit 1</p>
    <h1>Finish the Dossier</h1>
  </div>

  <div class="prog" id="prog" hidden>
    <span class="prog-lab" id="proglab"></span>
    <span class="prog-bar"><i id="progbar"></i></span>
  </div>

  <div id="screen"></div>
</div>

<script>
/* ===== short questions. the long version of each lives in the brief, not here ===== */
const LAYERS = [
{n:1, t:"Position", b:"1.2", ask:"Axial and appendicular regions, and three positional statements.", q:[
  ["Did you say which arm, leg or hand you are analysing?","Only matters if your movement uses two."],
  ["Are your three statements about your movement?","&ldquo;The elbow is distal to the shoulder&rdquo; is true of everyone."],
  ["Did you use the precise pairs?","Superior, inferior, anterior, posterior, medial, lateral, proximal, distal."],
  ["Did you include axial regions that are working?","A trunk held steady is doing something."]]},

{n:2, t:"Planes and terms", b:"1.3", ask:"The plane or planes, and the movement term at every joint.", q:[
  ["Did you name the axis as well as the plane?","Two pieces of information, and the pairing is counterintuitive."],
  ["Does every joint from Layer 1 have a term?","Not only the obvious one."],
  ["Does each joint have a term for both phases?",""],
  ["If it arcs or twists, did you say it is not one plane?","Naming one plane for a two-plane movement is an error, not a simplification."]]},

{n:3, t:"Connective tissue", b:"1.4", ask:"Which tissues are doing work, and what each contributes.", q:[
  ["Did you say what each tissue does in your movement?","Not what it does in general."],
  ["Did you name the actual muscle and the actual bone?","Not &ldquo;the arm&rdquo;."],
  ["If there is no impact, did you say so?","Better than leaving the box empty."],
  ["Is every tissue you listed actually working here?","Listing five because there are five is not analysis."]]},

{n:4, t:"Joints", b:"1.5", ask:"Classify every joint. At the primary joint, name the trade.", q:[
  ["Did you give the class and the type?","Synovial <i>and</i> hinge. Two pieces, not one."],
  ["Did you classify every joint, including the quiet ones?",""],
  ["Did you say which joint is primary, and why?",""],
  ["Is the trade written as a trade?","What is given up, and what is bought with it."]]},

{n:5, t:"Contraction", b:"1.6", ask:"The contraction type at each phase, including the return.", q:[
  ["Does the return phase have rows filled in?","Not just a heading."],
  ["Does the word <b>eccentric</b> appear anywhere?","If not: is nothing lowered under control, or did you not look?"],
  ["Is anything held rather than moved?","Holding is isometric. It counts."],
  ["Did you name each contraction in full?","Isotonic eccentric, not eccentric."]]},

{n:6, t:"Fibre type", b:"1.7", ask:"Which fibre types dominate, and your reasoning.", q:[
  ["Does your reasoning give force and duration?",""],
  ["Does the name of the activity appear in it?","If so, that sentence is not reasoning. The brief rules it out."],
  ["Could someone who disagreed check your reasoning?",""],
  ["Did you say what would change if the demand changed?","Heavier, faster, longer."]]},

{n:7, t:"Muscle pairs", b:"1.8", ask:"Agonist and antagonist at each joint, both phases.", q:[
  ["All four columns filled, for every joint?","Outward and return, agonist and antagonist."],
  ["Did you say what the antagonist is <i>doing</i>?","Relaxing and lengthening. Naming it is not the mark."],
  ["Does anything say the antagonist contracts to oppose?","That is the belief this unit was built to break. Find it."],
  ["Do the roles reverse between phases?","For most movements they should."]]},

{n:8, t:"Levers", b:"1.9", ask:"Lever class at the primary joint, justified from the arrangement.", q:[
  ["Did you locate effort, fulcrum and load in your movement?","Named structures, not the textbook diagram."],
  ["Did you decide the class from the arrangement?","&ldquo;Most are third class&rdquo; is not a justification."],
  ["Does the arrangement change between your phases?","For many movements it does, and saying so is strong."],
  ["Did you say what the movement gains from it?",""]]}
];

const CRIT = [
{c:"A", name:"Anatomical accuracy", b:[
  "Several structures or movements are misidentified. The analysis would not survive being checked.",
  "Mostly accurate. A small number of errors, none of them structural.",
  "Accurate throughout. Every named structure is the right one and every movement term is the right term."],
 how:"Check the three structures you are <i>least</i> sure about. Checking the confident ones feels productive and finds nothing."},
{c:"B", name:"Precision of language", b:[
  "Terms are used approximately, or everyday words stand in for anatomical ones.",
  "Terminology is mostly used correctly, with occasional imprecision.",
  "Every term is used in its exact sense. Nothing is described loosely where a precise word exists."],
 how:"Search your own text for: up, down, in front, behind, near, bends, straightens, the arm, the leg."},
{c:"C", name:"Completeness", b:[
  "Only part of the movement is analysed — usually the outward phase only.",
  "Most of the movement is covered. The return phase is present but thin.",
  "The whole movement is accounted for, both phases, at every joint involved."],
 how:"Count the joints in Layer 1. Count how many reach Layers 2, 5 and 7 in <i>both</i> phases. The difference is your gap."},
{c:"D", name:"Reasoning", b:[
  "Claims about muscle action, fibre type or lever class are asserted.",
  "Most claims are justified. Some rest on the name of the activity rather than its demands.",
  "Every claim is justified from the demands of the movement itself, and the reasoning could be checked by somebody who disagreed."],
 how:"Find every sentence stating a conclusion. Is <b>because</b> near it, and does what follows describe the movement?"}
];

const FAST = [
 ["Does the return phase have content at every joint?","Layers 5 and 7."],
 ["Does every joint in Layer 1 reappear in Layers 2, 4, 5 and 7?",""],
 ["Is there a <b>because</b> on your fibre type and your lever class?",""],
 ["Did you use an everyday word where a precise one exists?",""],
 ["Does anything say the antagonist contracts to oppose the movement?",""]
];

/* ============================================================ */
const KEY="sehs-u1-dossier-v2";
let S={step:"start", i:0, lay:{}, q:{}, crit:{}, ev:{}, fast:[]};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const el=id=>document.getElementById(id);
const STATES=[["none","Not started"],["thin","Thin"],["solid","Done"]];

el("themebtn").addEventListener("click",()=>{
  const c=document.documentElement.getAttribute("data-theme");
  const d=c? c==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", d?"light":"dark");
});

function ticks(k){ return S.q[k]||[]; }
function layerDone(n){ return (S.lay[n]||"none")!=="none"; }

/* ---------- screens ---------- */
function scrStart(){
  const done=LAYERS.filter(L=>layerDone(L.n)).length;
  const cdone=CRIT.filter(c=>S.crit[c.c]).length;
  return `
  <p class="lede">A last pass over your own dossier before you hand it in.
  Have it open beside you &mdash; every question here is about what is actually written in it.</p>

  <div class="choose">
    <button class="big-opt" data-go="fast">
      <span class="bo-k">Ten-minute pass</span>
      <span class="bo-t">Five questions</span>
      <span class="bo-d">The ones that find most of the lost marks. Start here if time is short.</span>
      ${S.fast.filter(Boolean).length? `<span class="bo-s">${S.fast.filter(Boolean).length} of 5 checked</span>`:``}
    </button>
    <button class="big-opt" data-go="layers">
      <span class="bo-k">Layer by layer</span>
      <span class="bo-t">Eight layers, four questions each</span>
      <span class="bo-d">One layer at a time. About fifteen minutes.</span>
      ${done? `<span class="bo-s">${done} of 8 marked</span>`:``}
    </button>
    <button class="big-opt" data-go="crit">
      <span class="bo-k">Mark your own</span>
      <span class="bo-t">The four criteria</span>
      <span class="bo-d">Best fit, the way you marked P, Q and R.</span>
      ${cdone? `<span class="bo-s">${cdone} of 4 marked</span>`:``}
    </button>
    <button class="big-opt plan-opt" data-go="plan">
      <span class="bo-k">What to fix first</span>
      <span class="bo-t">Your list</span>
      <span class="bo-d">Built from your answers above. Do the first thing on it.</span>
    </button>
  </div>

  <p class="xref"><a href="../terms/">Words for the Dossier &rarr;</a>
  <span>Every term the eight layers expect, with the page it came from.</span></p>

  <details class="why">
    <summary>Why there are no answers on this page</summary>
    <p>Nobody else in the class claimed your movement, so no page could tell you which joints are in it or
    what its lever class is. What it can do is ask what a reader will ask, so you find the gaps first.</p>
    <p>For <b>content</b> &mdash; what a condyloid joint is, which contraction is which &mdash; use the
    <a href="../">Unit 1 review</a>, your readings and the book.</p>
  </details>`;
}

function scrFast(){
  const n=S.fast.filter(Boolean).length;
  return `<h2 class="sh">Ten-minute pass</h2>
  <p class="sub2">Read your dossier against each one. Tick it when you have looked.</p>
  <ul class="qlist big">${FAST.map((f,i)=>`<li class="${S.fast[i]?"on":""}">
    <input type="checkbox" id="f${i}" data-f="${i}" ${S.fast[i]?"checked":""}>
    <label for="f${i}"><span class="qt">${f[0]}</span>${f[1]?`<span class="qw">${f[1]}</span>`:``}</label></li>`).join("")}</ul>
  <p class="aside">Four of the five are about the return phase or about justification. Between them,
  Completeness and Reasoning are half the marks.</p>
  <div class="nav2"><button class="btn ghost" data-go="start">Back</button>
  <button class="btn" data-go="${n===5?"plan":"layers"}">${n===5?"See what to fix":"Go deeper"}</button></div>`;
}

function scrLayer(){
  const L=LAYERS[S.i], k="L"+L.n, t=ticks(k), st=S.lay[L.n]||"none";
  return `<div class="shead"><span class="snum">Layer ${L.n} of 8</span><span class="sblk">block ${L.b}</span></div>
  <h2 class="sh">${L.t}</h2>
  <p class="sub2">${L.ask}</p>
  <ul class="qlist">${L.q.map((q,i)=>`<li class="${t[i]?"on":""}">
    <input type="checkbox" id="q${i}" data-l="${L.n}" data-i="${i}" ${t[i]?"checked":""}>
    <label for="q${i}"><span class="qt">${q[0]}</span>${q[1]?`<span class="qw">${q[1]}</span>`:``}</label></li>`).join("")}</ul>
  <div class="setst"><span>Where is this layer?</span>
    <span class="segs">${STATES.map(([v,l])=>`<button class="seg${st===v?" on":""}" data-s="${v}" data-l="${L.n}">${l}</button>`).join("")}</span>
  </div>
  <div class="nav2">
    <button class="btn ghost" data-go="${S.i===0?"start":"prev"}">${S.i===0?"Back":"Layer "+(L.n-1)}</button>
    <button class="btn" data-go="${S.i===7?"crit":"next"}">${S.i===7?"On to the criteria":"Layer "+(L.n+1)}</button>
  </div>`;
}

function scrCrit(){
  const c=CRIT[S.i], v=+S.crit[c.c]||0;
  return `<div class="shead"><span class="snum">Criterion ${S.i+1} of 4</span><span class="sblk">6 marks</span></div>
  <h2 class="sh">${c.c} &middot; ${c.name}</h2>
  <p class="sub2">Which description fits your dossier overall? Best fit, not every phrase.</p>
  <div class="bands">${[[1,"1–2"],[3,"3–4"],[5,"5–6"]].map(([val,lab],i)=>
    `<button class="band${v===val?" on":""}" data-c="${c.c}" data-v="${val}">
      <span class="bnum">${lab}</span><span class="btxt">${c.b[i]}</span></button>`).join("")}</div>
  <div class="how"><b>How to check it rather than guess.</b> ${c.how}</div>
  <label class="evl" for="ev">The sentence in your dossier that put it there &mdash; or the one that is missing</label>
  <textarea id="ev" data-c="${c.c}" placeholder="Quote it, or name what is missing…">${(S.ev[c.c]||"").replace(/</g,"&lt;")}</textarea>
  <div class="nav2">
    <button class="btn ghost" data-go="${S.i===0?"start":"prev"}">${S.i===0?"Back":"Criterion "+CRIT[S.i-1].c}</button>
    <button class="btn" data-go="${S.i===3?"plan":"next"}">${S.i===3?"What to fix first":"Criterion "+CRIT[S.i+1].c}</button>
  </div>`;
}

function scrPlan(){
  const marked=LAYERS.filter(L=>S.lay[L.n]);
  const unfinished=marked.filter(L=>S.lay[L.n]!=="solid");
  const weak=CRIT.filter(c=>S.crit[c.c] && +S.crit[c.c]<5).sort((a,b)=>S.crit[a.c]-S.crit[b.c]);
  const fastMiss=FAST.map((f,i)=>({f,i})).filter(x=>S.fast.length && !S.fast[x.i]);
  const nothing=!unfinished.length && !weak.length;
  let out=`<h2 class="sh">What to fix first</h2>`;

  if(!marked.length && !weak.length && !S.fast.filter(Boolean).length)
    return out+`<div class="card-note"><p>Nothing here yet. Work through the ten-minute pass or the layers,
      and whatever you leave unticked collects here in the order worth fixing.</p></div>
      <div class="nav2"><button class="btn ghost" data-go="start">Back</button>
      <button class="btn" data-go="fast">Start the ten-minute pass</button></div>`;

  if(nothing && !fastMiss.length)
    return out+`<div class="card-note ok"><p>Nothing outstanding on your own account. Before you believe that:
      hand it to somebody who did not write it and ask them to find the return phase at every joint.
      If they can, you are done.</p></div>
      <div class="nav2"><button class="btn ghost" data-go="start">Back</button></div>`;

  out+=`<p class="sub2">In order. Do the first one, not all of them.</p><ol class="plan">`;
  weak.forEach(c=>out+=`<li><span class="ptag crit">${c.c}</span><b>${c.name}</b>
    <span class="pband">you put yourself in ${+S.crit[c.c]<3?"1–2":"3–4"}</span><div>${c.how}</div></li>`);
  unfinished.filter(L=>S.lay[L.n]==="none").forEach(L=>out+=`<li><span class="ptag none">Missing</span>
    <b>Layer ${L.n} &middot; ${L.t}</b><div>${L.ask}</div></li>`);
  unfinished.filter(L=>S.lay[L.n]==="thin").forEach(L=>{
    const m=L.q.map((q,i)=>({q,i})).filter(x=>!ticks("L"+L.n)[x.i]);
    out+=`<li><span class="ptag thin">Thin</span><b>Layer ${L.n} &middot; ${L.t}</b>
      <div>${m.length? m.slice(0,2).map(x=>x.q[0]).join("<br>")+(m.length>2?`<br><i>and ${m.length-2} more</i>`:"") : "Go back and tick what you have checked."}</div></li>`;});
  fastMiss.forEach(x=>out+=`<li><span class="ptag thin">Quick</span><div>${x.f[0]}</div></li>`);
  out+=`</ol>`;
  const un=8-marked.length;
  if(un) out+=`<p class="aside">${un} layer${un>1?"s are":" is"} missing from this list because you have not
    marked ${un>1?"them":"it"} yet &mdash; not because ${un>1?"they are":"it is"} finished.</p>`;
  return out+`<div class="nav2"><button class="btn ghost" data-go="start">Back to the start</button></div>`;
}

/* ---------- render ---------- */
function render(){
  const s=S.step;
  el("screen").innerHTML = s==="start"? scrStart() : s==="fast"? scrFast()
    : s==="layers"? scrLayer() : s==="crit"? scrCrit() : scrPlan();
  const pr=el("prog");
  if(s==="layers"||s==="crit"){
    pr.hidden=false;
    const n=s==="layers"?8:4;
    el("proglab").textContent = (s==="layers"?"Layers":"Criteria")+" · "+(S.i+1)+" of "+n;
    el("progbar").style.width = ((S.i+1)/n*100)+"%";
  } else pr.hidden=true;
  save();
  window.scrollTo({top:0,behavior:"instant"});
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){
    const v=g.dataset.go;
    if(v==="next") S.i++;
    else if(v==="prev") S.i--;
    else { S.step=v; S.i=0; }
    render(); return;
  }
  const seg=e.target.closest(".seg");
  if(seg){ S.lay[seg.dataset.l]=seg.dataset.s; render(); return; }
  const band=e.target.closest(".band");
  if(band){ S.crit[band.dataset.c]=+band.dataset.v; render(); return; }
});
document.addEventListener("change",e=>{
  const c=e.target;
  if(c.matches("input[data-l]")){ const k="L"+c.dataset.l; S.q[k]=S.q[k]||[]; S.q[k][+c.dataset.i]=c.checked;
    c.closest("li").classList.toggle("on",c.checked); save(); return; }
  if(c.matches("input[data-f]")){ S.fast[+c.dataset.f]=c.checked;
    c.closest("li").classList.toggle("on",c.checked); save(); return; }
});
document.addEventListener("input",e=>{
  if(e.target.id==="ev"){ S.ev[e.target.dataset.c]=e.target.value; save(); }
});

render();
</script>

</body>
</html>
